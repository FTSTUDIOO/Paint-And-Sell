function getGame(){
  const bin=atob(B64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:'text/html'});
}
const st=t=>document.getElementById('st').textContent=t;
document.getElementById('dl').onclick=()=>{
  try{
    const url=URL.createObjectURL(getGame());
    const a=document.createElement('a');a.href=url;a.download='paint-and-sell.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    st('Downloaded! Open paint-and-sell.html from your downloads folder.');
  }catch(e){st('Download failed. Open this page as a local file and try again.')}
};
document.getElementById('play').onclick=()=>{
  try{
    const url=URL.createObjectURL(getGame());
    const w=window.open(url,'_blank');
    if(!w)location.href=url;
  }catch(e){st('Could not open the game here.')}
};
</script>
